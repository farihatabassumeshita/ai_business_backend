services:

  postgres:
    image: postgres:17
    container_name: ai_backend_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  fastapi:
    build: .

    container_name: ai_backend_fastapi

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - postgres


volumes:
  postgres_data: